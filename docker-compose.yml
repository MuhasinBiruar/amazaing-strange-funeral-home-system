# Development stack: source is bind-mounted, so edits hot-reload.
# See DOCKER.md.

x-dev: &dev
  build:
    context: .
    dockerfile: Dockerfile
    target: dev
  working_dir: /usr/src/app
  volumes:
    - .:/usr/src/app
    # Keep the container's Linux node_modules instead of the host's.
    - /usr/src/app/node_modules
    - /usr/src/app/client/node_modules
    - /usr/src/app/server/node_modules
    - /usr/src/app/shared/node_modules

services:
  # Builds shared/dist once; client and server import it.
  shared:
    <<: *dev
    command: npm run build:shared

  server:
    <<: *dev
    command: npm run dev --workspace=server
    env_file:
      - server/.env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '4000:4000'
    depends_on:
      shared:
        condition: service_completed_successfully

  client:
    <<: *dev
    command: npm run dev --workspace=client -- --hostname 0.0.0.0 --port 3000
    env_file:
      - client/.env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    depends_on:
      shared:
        condition: service_completed_successfully
