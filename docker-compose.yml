services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: npm run dev --workspace=server
    working_dir: /usr/src/app
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      BETTER_AUTH_URL: http://localhost:4000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    stdin_open: true
    tty: true

  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: npm run dev --workspace=client -- --hostname 0.0.0.0 --port 3000
    working_dir: /usr/src/app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    stdin_open: true
    tty: true